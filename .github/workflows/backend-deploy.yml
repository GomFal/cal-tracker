name: Backend Deploy

on:
  push:
    branches:
      - develop
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-deploy-${{ github.ref_type == 'tag' && 'pro' || 'dev' }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/autofactu/cal-tracker-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Resolve deployment target
        id: target
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "environment=pro" >> "$GITHUB_OUTPUT"
            echo "tag=pro-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.target.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.target.outputs.environment }}-latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_HOST_KEY_FINGERPRINTS: ${{ secrets.VPS_SSH_HOST_KEY_FINGERPRINTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_USER" && "$VPS_USER" != "root" ]] || {
            echo "VPS_USER must be the dedicated, non-root deployment account." >&2
            exit 1
          }
          scripts/deploy/configure-ssh.sh

      - name: Write server environment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
          DEV_GOOGLE_OAUTH_CLIENT_IDS: ${{ secrets.DEV_GOOGLE_OAUTH_CLIENT_IDS }}
          PRO_ENV_FILE: ${{ secrets.PRO_ENV_FILE }}
        run: |
          set -euo pipefail
          umask 077
          write_remote_file() {
            local name="$1"
            local content="$2"
            printf '%s' "$content" \
              | ssh "$VPS_USER@$VPS_HOST" sudo -n /usr/local/sbin/bettercalories-deploy write-env "$name"
          }

          normalized_dev_env="$RUNNER_TEMP/bettercalories-dev.env"
          DEV_ENV_FILE_CONTENT="$DEV_ENV_FILE" \
          DEV_GOOGLE_OAUTH_CLIENT_IDS="$DEV_GOOGLE_OAUTH_CLIENT_IDS" \
          NORMALIZED_DEV_ENV="$normalized_dev_env" \
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          client_ids = [
              value.strip()
              for value in os.environ["DEV_GOOGLE_OAUTH_CLIENT_IDS"].split(",")
              if value.strip()
          ]
          if not client_ids or not all(
              re.fullmatch(r"[A-Za-z0-9._-]+\.apps\.googleusercontent\.com", value)
              for value in client_ids
          ):
              raise SystemExit(
                  "DEV_GOOGLE_OAUTH_CLIENT_IDS must contain Google OAuth client IDs."
              )

          legacy_google_line = re.compile(
              r"^\s*(?:export\s+)?(?:GOOGLE_OAUTH_CLIENT_IDS|OAUTH_GOOGLE_SECRET)\s*="
          )
          source_lines = os.environ["DEV_ENV_FILE_CONTENT"].splitlines()
          normalized_lines = [
              line for line in source_lines if not legacy_google_line.match(line)
          ]
          normalized_lines.append(f"GOOGLE_OAUTH_CLIENT_IDS={','.join(client_ids)}")
          Path(os.environ["NORMALIZED_DEV_ENV"]).write_text(
              "\n".join(normalized_lines) + "\n",
              encoding="utf-8",
          )
          PY

          write_remote_file deploy.env "$DEPLOY_ENV_FILE"
          write_remote_file dev.env "$(cat "$normalized_dev_env")"
          write_remote_file pro.env "$PRO_ENV_FILE"
          rm -f "$normalized_dev_env"

      - name: Login GHCR on VPS
        id: ghcr_vps_login
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | ssh "$VPS_USER@$VPS_HOST" sudo -n /usr/local/sbin/bettercalories-deploy ghcr-login "$GHCR_USERNAME"

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          DEPLOY_ENVIRONMENT: ${{ steps.target.outputs.environment }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" sudo -n /usr/local/sbin/bettercalories-deploy deploy-backend \
            "$DEPLOY_ENVIRONMENT" "$IMAGE" "$GITHUB_SHA" "$DEPLOY_RUN_ID" "$DEPLOY_ACTOR"
          {
            echo "### Backend deployment"
            echo "- Environment: \`$DEPLOY_ENVIRONMENT\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Artifact: \`$IMAGE\`"
            echo "- Initiated by: \`$DEPLOY_ACTOR\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logout GHCR on VPS
        if: always() && steps.ghcr_vps_login.conclusion == 'success'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" sudo -n /usr/local/sbin/bettercalories-deploy ghcr-logout || true
