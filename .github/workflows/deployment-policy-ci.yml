name: Deployment Policy CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-deploy.yml"
      - ".github/workflows/mobile-apk-deploy.yml"
      - ".github/workflows/deployment-policy-ci.yml"
      - "infra/deploy/**"
      - "apps/admin/**"
      - "apps/landing/index.html"
      - "package.json"
      - "scripts/deploy/**"
      - "scripts/deploy-landing.sh"
      - "scripts/mobile/deploy-server-apks.sh"
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/backend-deploy.yml"
      - ".github/workflows/mobile-apk-deploy.yml"
      - ".github/workflows/deployment-policy-ci.yml"
      - "infra/deploy/**"
      - "apps/admin/**"
      - "apps/landing/index.html"
      - "package.json"
      - "scripts/deploy/**"
      - "scripts/deploy-landing.sh"
      - "scripts/mobile/deploy-server-apks.sh"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment shell scripts
        run: |
          set -euo pipefail
          bash -n \
            scripts/deploy/configure-ssh.sh \
            scripts/deploy/test-configure-ssh.sh \
            scripts/deploy/test-deployment-policy.sh \
            scripts/deploy-landing.sh \
            scripts/mobile/deploy-server-apks.sh \
            infra/deploy/bettercalories-deploy \
            infra/deploy/provision-deploy-user.sh \
            infra/deploy/publish-landing.sh \
            infra/deploy/bootstrap-server.sh \
            infra/deploy/deploy.sh

      - name: Test pinned SSH and deployment policy
        run: |
          set -euo pipefail
          scripts/deploy/test-configure-ssh.sh
          scripts/deploy/test-deployment-policy.sh

      - name: Test admin origin and web security policies
        run: |
          set -euo pipefail
          node apps/admin/validate.mjs
          node apps/admin/test-origin-policy.mjs
          node scripts/deploy/test-web-security-policy.mjs
