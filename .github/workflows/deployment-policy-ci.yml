name: Deployment Policy CI

on:
  pull_request:
    paths:
      - ".mise.toml"
      - "package.json"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-deploy.yml"
      - ".github/workflows/mobile-apk-deploy.yml"
      - ".github/workflows/deployment-policy-ci.yml"
      - "apps/backend/Dockerfile"
      - "apps/mobile/android/app/build.gradle.kts"
      - "infra/deploy/**"
      - "apps/admin/**"
      - "apps/landing/index.html"
      - "package.json"
      - "scripts/deploy/**"
      - "scripts/deploy-landing.sh"
      - "scripts/mobile/build-android.sh"
      - "scripts/mobile/deploy-server-apks.sh"
      - "scripts/mobile/test-update-manifest-policy.sh"
      - "scripts/mobile/validate-api-base-url.sh"
      - "scripts/mobile/validate-android-dev-signing.sh"
      - "scripts/mobile/validate-update-manifest.py"
      - "scripts/mobile/validate-android-release-signing.sh"
      - "scripts/mobile/verify-update-apk-metadata.sh"
      - "scripts/mobile/verify-apk-signing.sh"
  push:
    branches:
      - main
      - develop
    paths:
      - ".mise.toml"
      - "package.json"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-deploy.yml"
      - ".github/workflows/mobile-apk-deploy.yml"
      - ".github/workflows/deployment-policy-ci.yml"
      - "apps/backend/Dockerfile"
      - "apps/mobile/android/app/build.gradle.kts"
      - "infra/deploy/**"
      - "apps/admin/**"
      - "apps/landing/index.html"
      - "package.json"
      - "scripts/deploy/**"
      - "scripts/deploy-landing.sh"
      - "scripts/mobile/build-android.sh"
      - "scripts/mobile/deploy-server-apks.sh"
      - "scripts/mobile/test-update-manifest-policy.sh"
      - "scripts/mobile/validate-api-base-url.sh"
      - "scripts/mobile/validate-android-dev-signing.sh"
      - "scripts/mobile/validate-update-manifest.py"
      - "scripts/mobile/validate-android-release-signing.sh"
      - "scripts/mobile/verify-update-apk-metadata.sh"
      - "scripts/mobile/verify-apk-signing.sh"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment shell scripts
        run: |
          set -euo pipefail
          bash -n \
            scripts/deploy/configure-ssh.sh \
            scripts/deploy/smoke-container-runtime-hardening.sh \
            scripts/deploy/test-container-runtime-policy.sh \
            scripts/deploy/test-configure-ssh.sh \
            scripts/deploy/test-deployment-policy.sh \
            scripts/deploy/test-provision-deploy-user.sh \
            scripts/deploy/test-apk-signing-policy.sh \
            scripts/deploy/test-supply-chain-policy.sh \
            scripts/deploy/validate-apk-signing-policy.sh \
            scripts/deploy/validate-supply-chain-policy.sh \
            scripts/deploy-landing.sh \
            scripts/mobile/build-android.sh \
            scripts/mobile/deploy-server-apks.sh \
            scripts/mobile/test-update-manifest-policy.sh \
            scripts/mobile/validate-api-base-url.sh \
            scripts/mobile/validate-android-dev-signing.sh \
            scripts/mobile/validate-android-release-signing.sh \
            scripts/mobile/verify-apk-signing.sh \
            scripts/mobile/verify-update-apk-metadata.sh \
            infra/deploy/bettercalories-deploy \
            infra/deploy/backup-postgres-schema.sh \
            infra/deploy/provision-deploy-user.sh \
            infra/deploy/publish-landing.sh \
            infra/deploy/privacy-ledger-overlay.sh \
            infra/deploy/bootstrap-server.sh \
            infra/deploy/deploy.sh \
            infra/deploy/restore-postgres-schema.sh

      - name: Test pinned SSH and deployment policy
        run: |
          set -euo pipefail
          scripts/deploy/test-configure-ssh.sh
          scripts/deploy/test-container-runtime-policy.sh
          scripts/deploy/test-provision-deploy-user.sh
          scripts/deploy/test-apk-signing-policy.sh
          scripts/deploy/test-deployment-policy.sh
          scripts/deploy/test-supply-chain-policy.sh
          scripts/mobile/test-update-manifest-policy.sh
          infra/deploy/tests/backup-retention-test.sh
          infra/deploy/tests/privacy-ledger-overlay-test.sh

      - name: Test admin origin and web security policies
        run: |
          set -euo pipefail
          node apps/admin/validate.mjs
          node apps/admin/test-origin-policy.mjs
          node scripts/deploy/test-web-security-policy.mjs
