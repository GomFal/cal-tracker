<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Descargar Better Calories para Android</title>
    <meta name="robots" content="noindex, follow">
    <meta
      name="description"
      content="Descarga la APK de Better Calories para Android desde el canal de producción."
    >
    <link rel="canonical" href="https://bettercalories.app/download.html">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/styles.css">
    <style>
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(145deg, oklch(0.9 0.12 125 / 0.74), oklch(0.977 0.006 116)),
          var(--screen);
      }

      .download-card {
        width: min(560px, 100%);
        border-radius: var(--radius-xl);
        background: var(--surface);
        padding: 34px;
        box-shadow: var(--shadow);
      }

      .download-card .brand-lockup {
        margin-bottom: 26px;
      }

      .download-card h1 {
        max-width: 12ch;
        font-size: 2.6rem;
      }

      .download-card p {
        margin: 16px 0 24px;
        color: var(--ink-soft);
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main class="download-card">
      <a class="brand-lockup" href="/" aria-label="Volver a Better Calories">
        <img src="/assets/brand-icon.png" width="42" height="42" alt="">
        <span>Better Calories</span>
      </a>
      <h1>Descargar Android</h1>
      <p>
        El botón abre la última APK publicada en el canal de producción. Si la
        descarga no empieza, revisa el manifiesto público de versión.
      </p>
      <div class="hero-actions">
        <a class="button button-primary" href="https://api.bettercalories.app/apk/latest.apk">
          Descargar APK
        </a>
        <a class="button button-secondary" href="https://api.bettercalories.app/apk/latest.json" rel="nofollow">
          Ver versión
        </a>
      </div>
    </main>
  </body>
</html>
