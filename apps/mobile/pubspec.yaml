name: cal_tracker_mobile
description: Agent-operable calorie and nutrition tracker MVP.
publish_to: "none"
version: 0.1.11+27

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.0
  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.4
  go_router: ^16.3.0
  google_mlkit_text_recognition: ^0.13.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  http_parser: ^4.0.2
  image: ^4.8.0
  intl: any
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  record: ^6.1.2
  marionette_flutter: ^0.5.0
  shared_preferences: ^2.5.3
  flutter_svg: ^2.3.0
  flutter_markdown: ^0.7.7
  app_links: ^7.0.0
  animations: ^2.2.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  patrol: ^4.5.0
  marionette_mcp: ^0.5.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/images/
    - assets/images/icons/
    - assets/images/icons/svg/
    - assets/images/login/
    - assets/images/login/cropped/
    - assets/google_brand/android_neutral_rd_ctn@4x.png
