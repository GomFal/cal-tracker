name: cal_tracker_mobile
description: Agent-operable calorie and nutrition tracker MVP.
publish_to: "none"
version: 0.1.9+13

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  go_router: ^16.3.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  http_parser: ^4.0.2
  intl: any
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  record: ^6.1.2
  marionette_flutter: ^0.5.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  patrol: ^4.5.0
  marionette_mcp: ^0.5.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/images/app_icon_android_legacy_general.png
  image_path_ios: assets/images/app_icon_native_opaque.png
  adaptive_icon_background: assets/images/app_icon_android_adaptive_background_general.png
  adaptive_icon_foreground: assets/images/app_icon_android_adaptive_foreground_general.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#46953C"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/login/
    - assets/images/login/cropped/
    - assets/google_brand/android_neutral_rd_ctn@4x.png
