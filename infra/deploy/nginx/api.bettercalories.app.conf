server {
    listen 80;
    listen [::]:80;
    server_name api.bettercalories.app dev-api.bettercalories.app;
    server_tokens off;

    root /var/www/bettercalories.app/html;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.bettercalories.app;
    server_tokens off;

    include /etc/nginx/snippets/cal-tracker-security-headers.conf;

    ssl_certificate /etc/letsencrypt/live/api.bettercalories.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bettercalories.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location /apk/ {
        alias /srv/cal-tracker/mobile/prod/;
        types {
            application/json json;
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        include /etc/nginx/snippets/cal-tracker-security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/cal-tracker-pro-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev-api.bettercalories.app;
    server_tokens off;

    include /etc/nginx/snippets/cal-tracker-security-headers.conf;

    ssl_certificate /etc/letsencrypt/live/api.bettercalories.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bettercalories.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location /apk/ {
        alias /srv/cal-tracker/mobile/dev/;
        types {
            application/json json;
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        include /etc/nginx/snippets/cal-tracker-security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /srv/cal-tracker/admin/dev/;
        index index.html;
        include /etc/nginx/snippets/cal-tracker-security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }

    location / {
        include /etc/nginx/snippets/cal-tracker-dev-proxy.conf;
    }
}
