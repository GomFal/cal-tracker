# Browser-facing security policy shared by the HTTPS landing, API and admin
# panel. The script hash permits only the static JSON-LD block in the landing;
# executable JavaScript remains same-origin and eval/inline execution is denied.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self' https://api.bettercalories.app https://dev-api.bettercalories.app http://localhost:3000; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; script-src 'self' 'sha256-os4rSsBjP3nudivaqdw46DlvEbojFmBkH9k8c9wOH5Q='; style-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
